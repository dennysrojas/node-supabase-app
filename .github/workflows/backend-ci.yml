name: Backend CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Backend TypeCheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificación Estricta de Tipos (TypeScript)
        run: npm run typecheck

      - name: Ejecutar Suite Completa de Pruebas de Integración (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: http://127.0.0.1:15421
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-mock-service-role-key
          PORT: 3000

      - name: Compilación para Producción (tsc)
        run: npm run build
