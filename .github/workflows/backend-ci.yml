name: Backend CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Backend TypeCheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar Dependencias
        run: npm ci

      - name: Verificación Estricta de Tipos (TypeScript)
        run: npm run typecheck

      - name: Ejecutar Suite Completa de Pruebas de Integración (Vitest)
        run: npm test

      - name: Compilación para Producción (tsc)
        run: npm run build
